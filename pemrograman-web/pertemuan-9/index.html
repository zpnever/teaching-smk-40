<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			.header {
				height: 100vh;
				display: flex;
				flex-direction: row;
				padding-top: 50px;
			}

			.header-kiri {
				background-color: aqua;
				width: 50%;
				display: flex;
				flex-direction: column;
				justify-content: center;
				padding-left: 20px;
				padding-right: 20px;
			}

			.header-kanan {
				background-color: violet;
				width: 50%;
				display: flex;
				justify-content: center;
				align-items: center;
				position: relative;
			}

			img {
				border-radius: 30px;
				object-fit: cover;
				width: 70%;
				height: 80%;
			}

			.main {
				height: 200px;
				background-color: red;
			}

			/* .anomali {
				position:;
			} */

			.test {
				background-color: brown;
				height: 10px;
			}

			.nav {
				height: 50px;
				display: flex;
				position: fixed;
				padding: 0 30px;
				top: 0;
				justify-content: space-between;
				align-items: center;
				width: 100%;
				background-color: khaki;
				z-index: 99;
			}

			.nav-title {
				font-size: large;
				font-weight: bold;
				text-decoration: underline;
			}

			.nav ul {
				display: flex;
				gap: 10px;
			}

			.nav ul li {
				list-style: none;
			}

			.nav ul li a {
				text-decoration: none;
			}

			.search-button {
				border-radius: 50%;
				width: 30px;
				height: 30px;
			}

			.order-button {
				border-radius: 20px;
				height: 30px;
				padding: 0 10px;
			}

			.rating {
				background-color: white;
				padding: 15px;
				border-radius: 15px;
				position: absolute;
				bottom: 150px;
				left: 20px;
				display: flex;
				flex-direction: column;
				border: 1px solid black;
			}

			.rating .huruf {
				font-size: smaller;
			}

			.rating .angka {
				font-size: large;
				font-weight: bold;
			}

			.menu-hari-ini {
				height: 400px;
				display: flex;
				justify-content: center;
				position: relative;
			}

			.menu-hari-ini::after {
				content: "";
				height: 3px;
				border-radius: 4px;
				width: 40px;
				background-color: brown;
				position: absolute;
				top: 40px;
			}
		</style>
	</head>
	<body>
		<!-- HEADER -->
		<div class="header">
			<div class="nav">
				<span class="nav-title">RESTAURANT RAMEN</span>
				<ul>
					<li><a href="">Menu</a></li>
					<li><a href="">Kategori</a></li>
					<li><a href="">Tentang</a></li>
					<li><a href="">Promo</a></li>
					<li><a href="">Kontak</a></li>
				</ul>
				<div class="nav-kanan">
					<button class="search-button">Q</button>
					<button class="order-button">Order Now</button>
				</div>
			</div>
			<div class="header-kiri">
				<h1>RASA YANG MENGGODA!</h1>
				<p>
					Nikmati cita rasa ramen autentik Jepang dengan kuah kaldu yang dimasak
					hingga 18 jam. Setiap mangkuk adalah sebuah karya seni.
				</p>
			</div>
			<div class="header-kanan">
				<div class="rating">
					<span class="huruf">Rating Pelanggan</span>
					<span class="angka">⭐ 4.9 / 5.0</span>
				</div>
				<img src="./header.webp" alt="header.webp" />
			</div>
		</div>

		<!-- MENU HARI INI -->
		<div class="menu-hari-ini">
			<h2>Menu Pilihan Hari Ini</h2>
		</div>

		<div style="height: 2000px; background-color: red"></div>
	</body>
</html>
