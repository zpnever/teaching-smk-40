<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <title>Image Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            padding: 24px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            /* kunci utama: item boleh turun baris */
            gap: 12px;
        }

        .gallery img {
            width: 220px;
            /* lebar tetap tiap gambar */
            height: 160px;
            object-fit: cover;
            /* gambar tidak gepeng saat dipotong */
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <h1>Galeri Foto</h1>
    <div class="gallery">
        <img src="https://picsum.photos/id/10/220/160" alt="Foto 1">
        <img src="https://picsum.photos/id/20/220/160" alt="Foto 2">
        <img src="https://picsum.photos/id/30/220/160" alt="Foto 3">
        <img src="https://picsum.photos/id/40/220/160" alt="Foto 4">
        <img src="https://picsum.photos/id/50/220/160" alt="Foto 5">
        <img src="https://picsum.photos/id/60/220/160" alt="Foto 6">
    </div>
</body>

</html>
