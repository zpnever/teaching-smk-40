<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Fetch API</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Belajar Fetch API</h1>
    <p>Buka Console (F12). Pastikan internet aktif.</p>

    <section>
        <h3>1. Satu Postingan (B1)</h3>
        <button id="btnPost">Ambil Post #1</button>
        <h4 id="judulPost">-</h4>
        <p id="isiPost"></p>
    </section>

    <section>
        <h3>2. Profil Pengguna (B2)</h3>
        <button id="btnUser">Ambil Pengguna #1</button>
        <p id="profilUser">-</p>
    </section>

    <section>
        <h3>3. Tiga Postingan (B3)</h3>
        <button id="btnTigaPost">Tampilkan 3 Post</button>
        <ul id="daftarPost"></ul>
    </section>

    <section>
        <h3>4. Cari Post (B4, B5)</h3>
        <input id="inputIdPost" type="number" placeholder="ID post (1-100)">
        <button id="btnCariPost">Cari</button>
        <p id="hasilCari"></p>
    </section>

    <section>
        <h3>5. Cek Tugas (B6)</h3>
        <input id="inputIdTodo" type="number" placeholder="ID tugas (1-200)">
        <button id="btnTodo">Cek</button>
        <p id="hasilTodo"></p>
    </section>

    <section>
        <h3>6. Filter Penulis (B7 ⭐)</h3>
        <select id="pilihPenulis">
            <option value="">-- pilih penulis --</option>
            <option value="1">Penulis 1</option>
            <option value="2">Penulis 2</option>
            <option value="3">Penulis 3</option>
        </select>
        <p id="infoPenulis"></p>
        <ul id="daftarPostPenulis"></ul>
    </section>

    <section>
        <h3>7. Kirim Post Baru (B8 ⭐)</h3>
        <form id="formPost" novalidate>
            <input id="inputJudul" type="text" placeholder="Judul">
            <input id="inputIsi" type="text" placeholder="Isi">
            <button type="submit">Kirim</button>
        </form>
        <p id="pesanPost"></p>
    </section>

    <section>
        <h3>8. Simpan di Browser (B9 ⭐)</h3>
        <button id="btnCache">Ambil Pengguna #2</button>
        <p id="hasilCache"></p>
    </section>

    <script src="script.js"></script>
</body>

</html>
